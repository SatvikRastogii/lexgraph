name: CI

on:
  push:
    branches: [main, rag-hardening]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite covers chunking, BM25, rank fusion, retrieval metrics,
      # guardrails and judge parsing -- all pure logic. Nothing here reaches
      # Ollama, ChromaDB or an API, so CI needs neither a GPU nor a key.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate the gold set against the corpus
        run: python scripts/validate_goldset.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check lexgraph/ scripts/ tests/
