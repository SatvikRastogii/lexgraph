name: CI

on:
  push:
    branches: [main, streamlit-deploy]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite covers chunking, BM25, rank fusion, retrieval metrics,
      # guardrails and judge parsing -- all pure logic. Nothing here reaches
      # Ollama, ChromaDB or an API, so CI needs neither a GPU nor a key.
      #
      # numpy and requests are needed because lexgraph.router and
      # lexgraph.embeddings import them at module level; chromadb, fastembed
      # and flashrank are imported lazily inside functions, so the suite runs
      # without them and those integration checks skip.
      #
      # pandas and pyarrow are here because output/*.parquet is committed. The
      # graph-retrieval tests used to skip on a missing index; now that the
      # artefacts ship with the repository they can actually run, and covering
      # the loader against the real parquets is worth the install.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests pandas pyarrow

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate the gold set against the corpus
        run: python scripts/validate_goldset.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check lexgraph/ scripts/ tests/
