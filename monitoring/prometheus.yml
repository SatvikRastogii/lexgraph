global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: nvidia-gpu-exporter
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  - job_name: lexgraph-telemetry
    static_configs:
      - targets: ["telemetry-exporter:9200"]

  # Ollama has no native Prometheus endpoint; blackbox_exporter probes the
  # same /api/tags endpoint app.py's own sidebar health check already uses.
  - job_name: ollama-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://ollama:11434/api/tags"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
