[project]
name = "lexgraph"
version = "0.2.0"
description = "Retrieval, evaluation and guardrails for a legal RAG benchmark over Indian case law"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced here
    "B008",  # function calls in argument defaults are deliberate for clients
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # tests import after path setup
"scripts/*" = ["E402"]    # scripts insert the repo root on sys.path first
